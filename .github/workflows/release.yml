name: Build and Release

on:
  push:
    tags:
      - "v*" # v1.0.0 형식의 태그가 푸시될 때 실행

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리 가져오기 (contributors 정보용)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry export -f requirements.txt --without-hashes -o requirements.txt
          pip install -r requirements.txt
          pip install pyinstaller==6.18.0

      - name: Build executable
        run: |
          call build.bat
        shell: cmd

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate release notes
        id: release_notes
        run: |
          # 현재 태그를 제외한 이전 태그 찾기
          $allTags = git tag --sort=-creatordate | Where-Object { $_ -ne "${{ github.ref_name }}" }
          $previousTag = $allTags | Select-Object -First 1

          # 비교 범위 설정
          if ($previousTag) {
            $range = "$previousTag..HEAD"
            $compareUrl = "https://github.com/${{ github.repository }}/compare/$previousTag...${{ github.ref_name }}"
          } else {
            # 첫 번째 태그인 경우: 전체 히스토리
            $range = "HEAD"
            $compareUrl = "https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}"
          }

          Write-Host "Previous tag: $previousTag"
          Write-Host "Range: $range"

          # 기여자 목록 생성
          if ($previousTag) {
            $contributors = git log $range --format='%an' | Sort-Object -Unique
          } else {
            $contributors = git log --format='%an' | Sort-Object -Unique
          }

          if ($contributors) {
            $contributorList = ($contributors | ForEach-Object { "- $_" }) -join "`n"
          } else {
            $contributorList = "- No contributors found"
          }

          # 주요 커밋 목록 생성
          if ($previousTag) {
            $commits = git log $range --format='- %s (%h)' --no-merges | Select-Object -First 20
          } else {
            $commits = git log --format='- %s (%h)' --no-merges | Select-Object -First 20
          }

          if ($commits) {
            $commitList = $commits -join "`n"
          } else {
            $commitList = "- Initial release"
          }

          # 릴리즈 노트 작성
          $releaseNotes = @"
          ## What's Changed

          ### Contributors
          $contributorList

          ### Commits
          $commitList

          ---
          **Full Changelog**: $compareUrl
          "@

          # 파일로 저장
          $releaseNotes | Out-File -FilePath release_notes.md -Encoding utf8

          # 디버그 출력
          Write-Host "=== Release Notes ==="
          Get-Content release_notes.md
        shell: pwsh

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist/GG_Archive.exe -DestinationPath dist/GG_Archive-${{ steps.get_version.outputs.VERSION }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GG_Archive-${{ steps.get_version.outputs.VERSION }}
          path: |
            dist/GG_Archive-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GG_Archive-${{ steps.get_version.outputs.VERSION }}.zip
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
